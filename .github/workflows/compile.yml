name: Build LaTeX PDF

on:
  push:                # Trigger on push events
    branches:
      - december_2024  # Trigger on the main branch
  pull_request:        # Trigger on pull requests

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up LaTeX
    - name: Install LaTeX
      run: sudo apt-get update && sudo apt-get install -y texlive-full

    # Step 3: Creates the output directory
    - name: Create Output Directory
      run: mkdir -p output

    # Step 4: Compile LaTeX (1st pass)
    - name: First LaTeX Compilation
      run: pdflatex -interaction=nonstopmode -output-directory=output main.tex

    # Step 5: Run BibTeX for references
    - name: Run BibTeX
      run: bibtex output/main.aux

    # Step 6: Compile LaTeX document (2nd and 3rd pass for references)
    - name: Second LaTeX Compilation
      run: pdflatex -interaction=nonstopmode -output-directory=output main.tex
    - name: Third LaTeX Compilation
      run: pdflatex -interaction=nonstopmode -output-directory=output main.tex

    # Step 7: Upload PDF as an artifact
    - name: Upload PDF
      uses: actions/upload-artifact@v3
      with:
        name: compiled-pdf
        path: output/main.pdf
