name: Build LaTeX PDF

on:
  push:                # Trigger on push events
    branches:
      - december_2024  # Trigger on the main branch
  pull_request:        # Trigger on pull requests

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up LaTeX
    - name: Install LaTeX
      run: sudo apt-get update && sudo apt-get install -y texlive-full

    # Step 3: Compile LaTeX
    - name: Compile LaTeX document
      run: |
        pdflatex -interaction=nonstopmode -output-directory=output main.tex
        # Repeat pdflatex if you have references or indexes
        pdflatex -interaction=nonstopmode -output-directory=output main.tex

    # Step 4: Upload PDF as an artifact
    - name: Upload PDF
      uses: actions/upload-artifact@v3
      with:
        name: compiled-pdf
        path: output/main.pdf