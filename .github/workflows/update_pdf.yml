name: Automate Notion

on:
  workflow_dispatch: # Trigger workflow manually
    inputs:
      page_title:
        description: "Title of the Notion page to create"
        required: true

jobs:
  update-notion:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Call Notion API
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      run: |
        PAGE_TITLE="${{ github.event.inputs.page_title }}"
        RESPONSE=$(curl -s -o response.json -w "%{http_code}" -X POST "https://api.notion.com/v1/pages" \
          -H "Authorization: Bearer $NOTION_TOKEN" \
          -H "Content-Type: application/json" \
          -H "Notion-Version: 2022-06-28" \
          -d '{
            "parent": { "database_id": "'"$DATABASE_ID"'" },
            "properties": {
              "Name": {
                "title": [
                  {
                    "text": { "content": "'"$PAGE_TITLE"'" }
                  }
                ]
              }
            }
          }')
        if [ "$RESPONSE" -ne 200 ]; then
          echo "Error: $(cat response.json)"
          exit 1
        else
          echo "Page created successfully."
        fi
